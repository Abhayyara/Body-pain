name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding (keeps lib/, test/, pubspec.yaml)
        run: bash ./scripts/bootstrap.sh

      - run: flutter pub get

      # The code has never been compiled before this workflow, so analyze and
      # test are non-blocking: the APK build below is what proves it compiles.
      # Read their output in the job log and fix what they report.
      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: bodywise3d-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
